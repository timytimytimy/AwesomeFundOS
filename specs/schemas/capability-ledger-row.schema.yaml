version: 0.1.0
type: object
required:
  - version
  - timestamp
  - candidate_id
  - run_id
  - source_agent
  - target_agent
  - capability_kind
  - candidate_type
  - target_scope
  - status
  - application_status
  - proposal
  - source_basis
  - required_tests
  - scores
  - controls
  - approval_mode
  - human_approval_required
  - protected_mutation_allowed
  - reversible
  - mutated_agent_card
  - mutated_runtime_skill
  - mutated_core_profile
  - real_trade_allowed
  - broker_integration
properties:
  version: {type: string}
  timestamp: {type: string}
  candidate_id: {type: string}
  run_id: {type: string}
  source_agent: {type: string}
  target_agent: {type: string}
  capability_kind: {type: string}
  candidate_type: {type: string}
  target_scope: {type: string}
  status: {enum: [approved_candidate]}
  application_status: {enum: [pending_human_apply, blocked_regression, applied]}
  proposal: {type: string}
  source_basis:
    type: array
    items: {type: object}
  required_tests:
    type: array
    items: {type: string}
  scores: {type: object}
  controls:
    type: array
    items: {type: string}
  approval_mode: {enum: [evolution_gate_v1_capability_candidate]}
  human_approval_required: {enum: [true]}
  protected_mutation_allowed: {enum: [false]}
  reversible: {enum: [true]}
  mutated_agent_card: {enum: [false]}
  mutated_runtime_skill: {enum: [false]}
  mutated_core_profile: {enum: [false]}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
