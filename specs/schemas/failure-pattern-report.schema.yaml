version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - run_id
  - pattern_count
  - category_counts
  - severity_counts
  - patterns
  - controls
  - real_trade_allowed
  - broker_integration
  - disclaimer
properties:
  version: {type: string}
  artifact_type: {enum: [failure_pattern_report]}
  run_id: {type: string}
  pattern_count: {type: integer}
  category_counts:
    type: object
  severity_counts:
    type: object
  patterns:
    type: array
    items:
      type: object
      required:
        - version
        - pattern_id
        - run_id
        - agent_id
        - category
        - description
        - severity
        - prevention_check
        - metadata
        - tags
        - review_before_evolution
        - real_trade_allowed
        - broker_integration
      properties:
        version: {type: string}
        pattern_id: {type: string}
        run_id: {type: string}
        agent_id: {type: string}
        category: {type: string}
        description: {type: string}
        severity: {type: string}
        prevention_check: {type: string}
        metadata:
          type: object
        tags:
          type: array
          items: {type: string}
        review_before_evolution: {enum: [true]}
        real_trade_allowed: {enum: [false]}
        broker_integration: {enum: [disabled]}
  controls:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
  disclaimer: {type: string}
