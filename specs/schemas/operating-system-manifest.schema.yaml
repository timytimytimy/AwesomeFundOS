version: 0.1.0
type: object
required:
  - artifact_type
  - run_id
  - runtime_mode
  - selected_agent_count
  - model_record_count
  - loaded_asset_counts
  - all_selected_agents_have_runtime_assets
  - all_agent_os_contracts_valid
  - agent_os_contract_summary
  - agents
  - model_records
  - harness_artifacts
  - memory_thread_artifacts
  - evolution_artifacts
  - evolution_summary
  - source_provenance_summary
  - context_management_summary
  - portfolio_outcome_summary
  - agent_performance_summary
  - agent_governance_summary
  - evaluation_summary
  - safety_invariants
  - real_trade_allowed
  - broker_integration
properties:
  artifact_type:
    enum: [operating_system_manifest]
  run_id: {type: string}
  input:
    type: object
    properties:
      input_type:
        enum: [topic, stock, question]
      value: {type: string}
  market: {type: string}
  runtime_mode:
    enum: [local_file_protocol]
  selected_agent_count: {type: integer}
  model_record_count: {type: integer}
  loaded_asset_counts:
    type: object
    required: [agent_card, skill, context_policy, tool_policy, memory_policy]
    properties:
      agent_card: {type: integer}
      skill: {type: integer}
      context_policy: {type: integer}
      tool_policy: {type: integer}
      memory_policy: {type: integer}
  all_selected_agents_have_runtime_assets: {type: boolean}
  all_agent_os_contracts_valid: {type: boolean}
  agent_os_contract_summary:
    type: object
    required: [checked_agents, valid_contracts, invalid_contracts, mismatched_agents, real_trade_allowed, broker_integration]
    properties:
      checked_agents: {type: integer}
      valid_contracts: {type: integer}
      invalid_contracts: {type: integer}
      mismatched_agents:
        type: array
        items: {type: string}
      real_trade_allowed:
        enum: [false]
      broker_integration:
        enum: [disabled]
  missing_agent_assets:
    type: array
    items:
      type: object
      properties:
        agent_id: {type: string}
        asset_kind: {type: string}
        path: {type: string}
  agents:
    type: array
    items:
      type: object
      required: [agent_id, agent_card_path, skill_path, context_policy_path, tool_policy_path, memory_policy_path]
      properties:
        agent_id: {type: string}
        agent_card_path: {type: string}
        skill_path: {type: string}
        context_policy_path: {type: string}
        tool_policy_path: {type: string}
        memory_policy_path: {type: string}
        os_contract_checks:
          type: object
          required:
            - valid
            - asset_paths_exist
            - agent_card_matches_roster
            - skill_references_agent_card
            - tool_policy_matches_roster_tools
            - memory_policy_matches_agent_namespace
            - context_policy_preserves_kol_methodology_boundary
            - safety_boundaries_disabled
            - mismatches
            - real_trade_allowed
            - broker_integration
          properties:
            valid: {type: boolean}
            asset_paths_exist: {type: boolean}
            agent_card_matches_roster: {type: boolean}
            skill_references_agent_card: {type: boolean}
            tool_policy_matches_roster_tools: {type: boolean}
            memory_policy_matches_agent_namespace: {type: boolean}
            context_policy_preserves_kol_methodology_boundary: {type: boolean}
            safety_boundaries_disabled: {type: boolean}
            mismatches:
              type: array
              items: {type: string}
            real_trade_allowed:
              enum: [false]
            broker_integration:
              enum: [disabled]
        assets:
          type: object
  model_records:
    type: array
    items:
      type: object
      required:
        - agent_id
        - model
        - model_policy_id
        - reasoning_effort
        - skill_versions
        - tool_versions
        - tool_contract_id
        - runtime_mode
        - real_trade_allowed
        - broker_integration
      properties:
        agent_id: {type: string}
        model: {type: string}
        model_policy_id: {type: string}
        reasoning_effort: {type: string}
        skill_versions:
          type: array
          items: {type: string}
        tool_versions:
          type: array
          items: {type: string}
        tool_contract_id: {type: string}
        runtime_mode:
          enum: [local_file_protocol]
        real_trade_allowed:
          enum: [false]
        broker_integration:
          enum: [disabled]
  harness_artifacts:
    type: array
    items: {type: string}
  memory_thread_artifacts:
    type: array
    items: {type: string}
  evolution_artifacts:
    type: array
    items: {type: string}
  evolution_summary:
    type: object
    required:
      - gate_results
      - accepted
      - quarantined
      - rejected
      - memory_writes
      - approved_candidates
      - pending_human_apply
      - real_trade_allowed
      - broker_integration
    properties:
      gate_results: {type: integer}
      accepted: {type: integer}
      quarantined: {type: integer}
      rejected: {type: integer}
      memory_writes: {type: integer}
      approved_candidates: {type: integer}
      pending_human_apply: {type: integer}
      real_trade_allowed:
        enum: [false]
      broker_integration:
        enum: [disabled]
  source_provenance_summary:
    type: object
    required:
      - registry_source_count
      - registry_source_tier_counts
      - registry_source_type_counts
      - ingested_sources
      - quarantined_sources
      - pattern_candidates
      - evolution_candidates
      - direct_trade_signal_blocked
      - copyright_violation_blocked
      - all_patterns_start_quarantined
      - evidence_item_count
      - evidence_tier_counts
      - evidence_type_counts
      - primary_fact_evidence_items
      - low_tier_evidence_items
      - methodology_sources_are_hypothesis_only
      - primary_evidence_required_for_company_conclusions
      - real_trade_allowed
      - broker_integration
    properties:
      registry_source_count: {type: integer}
      registry_source_tier_counts: {type: object}
      registry_source_type_counts: {type: object}
      ingested_sources: {type: integer}
      quarantined_sources: {type: integer}
      pattern_candidates: {type: integer}
      evolution_candidates: {type: integer}
      direct_trade_signal_blocked: {type: boolean}
      copyright_violation_blocked: {type: boolean}
      all_patterns_start_quarantined: {type: boolean}
      evidence_item_count: {type: integer}
      evidence_tier_counts: {type: object}
      evidence_type_counts: {type: object}
      primary_fact_evidence_items: {type: integer}
      low_tier_evidence_items: {type: integer}
      methodology_sources_are_hypothesis_only: {type: boolean}
      primary_evidence_required_for_company_conclusions: {type: boolean}
      real_trade_allowed:
        enum: [false]
      broker_integration:
        enum: [disabled]
  context_management_summary:
    type: object
    required:
      - overall
      - agents_evaluated
      - budget_manifest_present
      - token_budget_respected
      - loss_accounting_present
      - role_specific_compression_present
      - evidence_loss_auditable
      - excluded_items
      - estimated_tokens_before
      - estimated_tokens_after
      - drop_reasons
      - thread_memory_summary_quality
      - thread_summaries_available
      - thread_summary_signals_present
      - controls
      - real_trade_allowed
      - broker_integration
    properties:
      overall: {type: number}
      agents_evaluated: {type: integer}
      budget_manifest_present: {type: integer}
      token_budget_respected: {type: integer}
      loss_accounting_present: {type: integer}
      role_specific_compression_present: {type: integer}
      evidence_loss_auditable: {type: integer}
      excluded_items: {type: integer}
      estimated_tokens_before: {type: integer}
      estimated_tokens_after: {type: integer}
      drop_reasons:
        type: array
        items: {type: string}
      thread_memory_summary_quality: {type: number}
      thread_summaries_available: {type: integer}
      thread_summary_signals_present: {type: integer}
      controls:
        type: array
        items: {type: string}
      real_trade_allowed:
        enum: [false]
      broker_integration:
        enum: [disabled]
  portfolio_outcome_summary:
    type: object
    required:
      - watchlist_items
      - paper_actions
      - reviewed_actions
      - attribution_items
      - learning_candidates
      - outcome_status
      - actions_evaluated
      - actions_missing_market_replay
      - outcome_quality_score
      - real_trade_violations
      - review_verdict
      - controls
      - real_trade_allowed
      - broker_integration
    properties:
      watchlist_items: {type: integer}
      paper_actions: {type: integer}
      reviewed_actions: {type: integer}
      attribution_items: {type: integer}
      learning_candidates: {type: integer}
      outcome_status: {type: string}
      actions_evaluated: {type: integer}
      actions_missing_market_replay: {type: integer}
      outcome_quality_score: {type: number}
      real_trade_violations: {type: integer}
      review_verdict: {type: string}
      controls:
        type: array
        items: {type: string}
      real_trade_allowed:
        enum: [false]
      broker_integration:
        enum: [disabled]
  agent_performance_summary:
    type: object
    required: [agent_count, average_final_score, recommended_action_counts, ledger_entries_written, real_trade_allowed, broker_integration]
    properties:
      agent_count: {type: integer}
      average_final_score: {type: number}
      recommended_action_counts: {type: object}
      ledger_entries_written: {type: integer}
      real_trade_allowed:
        enum: [false]
      broker_integration:
        enum: [disabled]
  agent_governance_summary:
    type: object
    required: [agent_count, governance_quality_score, governance_action_counts, seat_competition_count, real_trade_allowed, broker_integration]
    properties:
      agent_count: {type: integer}
      governance_quality_score: {type: number}
      governance_action_counts: {type: object}
      seat_competition_count: {type: integer}
      real_trade_allowed:
        enum: [false]
      broker_integration:
        enum: [disabled]
  evaluation_summary:
    type: object
    required: [overall_score, agent_performance_score, agent_governance_score, agent_os_contract_score, blocking_issue_count, accepted_output_count, real_trade_allowed, broker_integration]
    properties:
      overall_score: {type: number}
      agent_performance_score: {type: number}
      agent_governance_score: {type: number}
      agent_os_contract_score: {type: number}
      blocking_issue_count: {type: integer}
      accepted_output_count: {type: integer}
      real_trade_allowed:
        enum: [false]
      broker_integration:
        enum: [disabled]
  safety_invariants:
    type: object
    required:
      - research_watchlist_paper_only
      - paper_portfolio_only
      - no_personalized_investment_advice
      - no_real_trade
      - broker_integration_disabled
      - kol_is_hypothesis_only
      - durable_learning_requires_harness_and_evolution_gate
    properties:
      research_watchlist_paper_only: {type: boolean}
      paper_portfolio_only: {type: boolean}
      no_personalized_investment_advice: {type: boolean}
      no_real_trade: {type: boolean}
      broker_integration_disabled: {type: boolean}
      kol_is_hypothesis_only: {type: boolean}
      durable_learning_requires_harness_and_evolution_gate: {type: boolean}
  controls:
    type: array
    items: {type: string}
  disclaimer: {type: string}
  real_trade_allowed:
    enum: [false]
  broker_integration:
    enum: [disabled]
