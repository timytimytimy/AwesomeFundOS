version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - run_id
  - overall_score
  - adapter_coverage_score
  - adapter_coverage
  - research_plan_coverage
  - source_tier_counts
  - source_type_counts
  - source_boundary_quality
  - blocking_issues
  - high_confidence_allowed
  - controls
  - real_trade_allowed
  - broker_integration
properties:
  version: {type: string}
  artifact_type: {enum: [tool_harness_report]}
  run_id: {type: string}
  overall_score: {type: number}
  adapter_coverage_score: {type: number}
  adapter_coverage:
    type: object
    required: [retrieval_plan_steps, public_research_items, primary_public_items, low_tier_public_items, announcement_items, policy_items, market_data_items]
    properties:
      retrieval_plan_steps: {type: integer}
      public_research_items: {type: integer}
      primary_public_items: {type: integer}
      low_tier_public_items: {type: integer}
      announcement_items: {type: integer}
      policy_items: {type: integer}
      market_data_items: {type: integer}
  research_plan_coverage:
    type: object
    required: [planned_categories, categories_covered, missing_categories, category_counts, plan_step_count]
    properties:
      planned_categories: {type: integer}
      categories_covered: {type: integer}
      missing_categories:
        type: array
        items: {type: string}
      category_counts: {type: object}
      plan_step_count: {type: integer}
  source_tier_counts: {type: object}
  source_type_counts: {type: object}
  source_boundary_quality:
    type: object
    required: [score, methodology_items, kol_items, social_items, kol_sources_downgraded, methodology_not_allowed_outputs_present, social_claims_low_confidence, controls]
    properties:
      score: {type: number}
      methodology_items: {type: integer}
      kol_items: {type: integer}
      social_items: {type: integer}
      kol_sources_downgraded: {type: boolean}
      methodology_not_allowed_outputs_present: {type: boolean}
      social_claims_low_confidence: {type: boolean}
      controls:
        type: array
        items: {type: string}
  blocking_issues:
    type: array
    items: {type: string}
  high_confidence_allowed: {type: boolean}
  controls:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
