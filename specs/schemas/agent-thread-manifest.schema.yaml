version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - run_id
  - thread_count
  - event_type
  - threads
  - controls
  - real_trade_allowed
  - broker_integration
properties:
  version: {type: string}
  artifact_type: {enum: [run_agent_thread_manifest]}
  run_id: {type: string}
  thread_count: {type: integer}
  event_type: {type: string}
  threads:
    type: array
    items:
      type: object
      required:
        - agent_id
        - thread_path
        - event_log_path
        - latest_event_type
      properties:
        agent_id: {type: string}
        thread_path: {type: string}
        event_log_path: {type: string}
        latest_event_type: {type: string}
  controls:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
