version: 0.1.0
type: object
required:
  - candidate_id
  - run_id
  - source_agent
  - target_agent
  - candidate_type
  - target_scope
  - decision
  - scores
  - reasons
  - controls
  - memory_write_allowed
  - required_tests
  - source_basis
  - proposal
  - protected_mutation_allowed
  - auto_apply_allowed
  - real_trade_allowed
  - broker_integration
properties:
  version: {type: string}
  candidate_id: {type: string}
  run_id: {type: string}
  source_agent: {type: string}
  target_agent: {type: string}
  candidate_type: {type: string}
  target_scope: {type: string}
  decision: {enum: [accept, quarantine, reject]}
  scores: {type: object}
  reasons:
    type: array
    items: {type: string}
  controls:
    type: array
    items: {type: string}
  memory_write_allowed: {type: boolean}
  required_tests:
    type: array
    items: {type: string}
  source_registry_required_gates:
    type: array
    items: {type: string}
  required_follow_up_tests:
    type: array
    items: {type: string}
  source_basis:
    type: array
    items: {type: object}
  proposal: {type: string}
  metadata: {type: object}
  hypothesis_origin_quality: {type: object}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
  adoption_route: {type: [string, 'null']}
  memory_write_policy: {type: [string, 'null']}
  capability_kind: {type: [string, 'null']}
  human_approval_required: {type: [boolean, 'null']}
  protected_mutation_allowed: {enum: [false]}
  auto_apply_allowed: {enum: [false]}
  rationale: {type: string}
