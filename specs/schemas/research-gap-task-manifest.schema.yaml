version: 0.1.0
type: object
required:
  - artifact_type
  - run_id
  - research_gap_count
  - tasks
  - controls
  - real_trade_allowed
  - broker_integration
properties:
  artifact_type: {enum: [research_gap_task_manifest]}
  run_id: {type: string}
  research_gap_count: {type: integer}
  answered_count: {type: integer}
  closed_count: {type: integer}
  pending_count: {type: integer}
  unsafe_blocked_count: {type: integer}
  accepted_evidence_count: {type: integer}
  tasks:
    type: array
    items:
      type: object
      required:
        - task_id
        - category
        - owner_agent_id
        - priority
        - reason
        - brief_path
        - status
        - allowed_output
        - real_trade_allowed
        - broker_integration
      properties:
        task_id: {type: string}
        category: {type: string}
        owner_agent: {type: string}
        owner_agent_id: {type: string}
        priority: {type: string}
        reason: {type: string}
        source: {type: string}
        source_agent_id: {type: [string, 'null']}
        source_evidence_id: {type: [string, 'null']}
        source_claim_id: {type: [string, 'null']}
        source_type: {type: [string, 'null']}
        source_tier: {type: [string, 'null']}
        hypothesis: {type: string}
        validation_required: {type: string}
        brief_path: {type: string}
        status: {type: string}
        answer_status: {type: string}
        result_path: {type: string}
        result_category: {type: string}
        result_owner_agent_id: {type: string}
        closure_status: {type: string}
        accepted_evidence_ids:
          type: array
          items: {type: string}
        accepted_claim_ids:
          type: array
          items: {type: string}
        allowed_output: {enum: [research_follow_up_brief_only]}
        real_trade_allowed: {enum: [false]}
        broker_integration: {enum: [disabled]}
  controls:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
