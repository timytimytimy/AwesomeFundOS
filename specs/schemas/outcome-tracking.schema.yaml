version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - run_id
  - outcome_status
  - actions_evaluated
  - actions_missing_market_replay
  - market_replay_items
  - outcome_quality_score
  - results
  - controls
  - real_trade_allowed
  - broker_integration
  - disclaimer
properties:
  version: {type: string}
  artifact_type: {enum: [portfolio_outcome_tracking]}
  run_id: {type: string}
  outcome_status: {type: string}
  actions_evaluated: {type: integer}
  actions_missing_market_replay: {type: integer}
  market_replay_items: {type: integer}
  outcome_quality_score: {type: number}
  results:
    type: array
    items:
      type: object
      required:
        - action_id
        - run_id
        - watchlist_id
        - subject
        - action_type
        - target_weight
        - real_trade_allowed
        - broker_integration
        - disclaimer
        - outcome_status
        - return_pct
        - max_drawdown_pct
        - max_favorable_excursion_pct
        - max_adverse_excursion_pct
        - review_verdict
      properties:
        action_id: {type: string}
        run_id: {type: string}
        watchlist_id: {type: string}
        subject: {type: string}
        action_type: {type: string}
        target_weight: {type: number}
        real_trade_allowed: {enum: [false]}
        broker_integration: {enum: [disabled]}
        disclaimer: {type: string}
        outcome_status: {type: string}
        start_date: {type: string}
        end_date: {type: string}
        start_close: {type: number}
        end_close: {type: number}
        bars: {type: integer}
        return_pct: {type: [number, 'null']}
        max_drawdown_pct: {type: [number, 'null']}
        max_favorable_excursion_pct: {type: [number, 'null']}
        max_adverse_excursion_pct: {type: [number, 'null']}
        review_verdict: {type: string}
  controls:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
  disclaimer: {type: string}
