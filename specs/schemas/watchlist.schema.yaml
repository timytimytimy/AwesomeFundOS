version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - run_id
  - items
  - real_trade_allowed
  - broker_integration
  - disclaimer
properties:
  version: {type: string}
  artifact_type: {enum: [watchlist]}
  run_id: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
  items:
    type: array
    items:
      type: object
      required:
        - watchlist_id
        - run_id
        - subject
        - market
        - status
        - source_decision_label
        - review_date
        - kill_criteria
        - evidence_references
        - real_trade_allowed
        - broker_integration
        - disclaimer
      properties:
        watchlist_id: {type: string}
        run_id: {type: string}
        subject: {type: string}
        market: {type: string}
        status: {type: string}
        source_decision_label: {type: string}
        stance: {type: string}
        conviction: {type: string}
        priority: {type: string}
        review_date: {type: string}
        triggers:
          type: array
          items: {type: string}
        add_conditions:
          type: array
          items: {type: string}
        reduce_conditions:
          type: array
          items: {type: string}
        exit_conditions:
          type: array
          items: {type: string}
        kill_criteria:
          type: array
          items: {type: string}
        evidence_references:
          type: array
          items:
            type: object
            properties:
              evidence_id: {type: string}
              claim_id: {type: string}
              usage: {type: string}
        notes:
          type: array
          items: {type: string}
        real_trade_allowed: {enum: [false]}
        broker_integration: {enum: [disabled]}
        disclaimer: {type: string}
  disclaimer: {type: string}
