version: 0.1.0
type: object
required:
  - artifact_type
  - run_id
  - evidence_items
  - real_trade_allowed
  - broker_integration
properties:
  artifact_type: {enum: [tool_runtime_evidence]}
  run_id: {type: string}
  evidence_items:
    type: array
    items:
      type: object
      required:
        - id
        - run_id
        - tool_result_id
        - adapter_id
        - agent_id
        - source_id
        - source_type
        - source_tier
        - title
        - retrieved_at
        - raw_excerpt
        - summary
        - confidence
        - not_allowed_outputs
        - claims
      properties:
        id: {type: string}
        run_id: {type: string}
        tool_result_id: {type: string}
        adapter_id: {type: string}
        agent_id: {type: [string, 'null']}
        source_id: {enum: [fixture_tool_runtime]}
        source_type: {type: string}
        source_tier: {type: string}
        title: {type: string}
        url: {type: string}
        published_at: {type: string}
        retrieved_at: {type: string}
        raw_excerpt: {type: string}
        summary: {type: string}
        confidence: {enum: [high, medium, low]}
        not_allowed_outputs:
          type: array
          items: {type: string}
        claims:
          type: array
          items:
            type: object
            required:
              - claim_id
              - claim_text
              - claim_type
              - confidence
              - relevant_to
              - supports
              - contradicts
            properties:
              claim_id: {type: string}
              claim_text: {type: string}
              claim_type: {type: string}
              confidence: {enum: [high, medium, low]}
              relevant_to:
                type: array
                items: {type: string}
              supports:
                type: array
                items: {type: string}
              contradicts:
                type: array
                items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
