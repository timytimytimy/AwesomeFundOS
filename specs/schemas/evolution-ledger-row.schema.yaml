version: 0.1.0
type: object
required:
  - timestamp
  - candidate_id
  - run_id
  - source_agent
  - target_agent
  - candidate_type
  - target_scope
  - proposal
  - source_basis
  - required_tests
  - scores
  - controls
  - approval_mode
  - reversible
  - real_trade_allowed
  - broker_integration
properties:
  timestamp: {type: string}
  candidate_id: {type: string}
  run_id: {type: string}
  source_agent: {type: string}
  target_agent: {type: string}
  candidate_type: {type: string}
  target_scope: {type: string}
  proposal: {type: string}
  source_basis:
    type: array
    items: {type: object}
  required_tests:
    type: array
    items: {type: string}
  scores: {type: object}
  controls:
    type: array
    items: {type: string}
  approval_mode: {enum: [evolution_gate_v1_auto_controlled]}
  reversible: {enum: [true]}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
