version: 0.1.0
type: object
required:
  - artifact_type
  - competition_id
  - source_path
  - run_id
  - topic
  - overall_score
  - style_count
  - disagreement_count
  - style_views
  - disagreement_register
  - winner
  - checks
  - blocking_issues
  - controls
  - real_trade_allowed
  - broker_integration
properties:
  artifact_type: {enum: [pm_style_competition_report]}
  competition_id: {type: string}
  source_path: {type: string}
  run_id: {type: string}
  topic: {type: string}
  overall_score: {type: number}
  style_count: {type: integer}
  disagreement_count: {type: integer}
  style_views:
    type: array
    items:
      type: object
      required:
        - style_id
        - stance
        - confidence
        - contributors
        - risk_boundary
        - real_trade_allowed
        - broker_integration
        - authority
      properties:
        style_id: {type: string}
        display_name: {type: string}
        mandate: {type: string}
        stance: {type: string}
        confidence: {type: string}
        time_horizon: {type: string}
        risk_posture: {type: string}
        contributors:
          type: array
          items: {type: string}
        matched_agent_count: {type: integer}
        evidence_summary: {type: object}
        thesis_fragment: {type: string}
        risk_boundary:
          type: object
          required: [hypothetical_position_cap, kill_criteria, requires_review_before_any_change, real_trade_allowed, broker_integration]
          properties:
            hypothetical_position_cap: {type: string}
            kill_criteria:
              type: array
              items: {type: string}
            requires_review_before_any_change: {type: boolean}
            real_trade_allowed: {enum: [false]}
            broker_integration: {enum: [disabled]}
        required_followups:
          type: array
          items: {type: string}
        real_trade_allowed: {enum: [false]}
        broker_integration: {enum: [disabled]}
        authority: {enum: [simulation_only]}
  disagreement_register:
    type: array
    items:
      type: object
      required: [issue_id, left_style, right_style, status, required_resolution, real_trade_allowed, broker_integration]
      properties:
        issue_id: {type: string}
        left_style: {type: string}
        right_style: {type: string}
        left_stance: {type: string}
        right_stance: {type: string}
        status: {type: string}
        required_resolution: {type: string}
        real_trade_allowed: {enum: [false]}
        broker_integration: {enum: [disabled]}
  winner:
    type: object
    required: [style_id, authority, capital_authority_changed, real_trade_allowed, broker_integration]
    properties:
      style_id: {type: string}
      stance: {type: string}
      reason: {type: string}
      authority: {enum: [simulation_only]}
      capital_authority_changed: {enum: [false]}
      real_trade_allowed: {enum: [false]}
      broker_integration: {enum: [disabled]}
  checks: {type: object}
  blocking_issues:
    type: array
    items: {type: string}
  controls:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
