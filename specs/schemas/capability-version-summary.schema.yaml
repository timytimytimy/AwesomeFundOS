version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - approved_candidates
  - quarantined_candidates
  - rejected_candidates
  - pending_human_apply
  - skipped_existing
  - agent_versions
  - written_paths
  - approval_mode
  - controls
  - direct_profile_mutation_allowed
  - direct_skill_mutation_allowed
  - direct_tool_mutation_allowed
  - real_trade_allowed
  - broker_integration
properties:
  version: {type: string}
  artifact_type: {enum: [capability_version_summary]}
  approved_candidates: {type: integer}
  quarantined_candidates: {type: integer}
  rejected_candidates: {type: integer}
  pending_human_apply: {type: integer}
  skipped_existing: {type: integer}
  agent_versions: {type: object}
  written_paths:
    type: array
    items: {type: string}
  approval_mode: {enum: [evolution_gate_v1_capability_candidate]}
  controls:
    type: array
    items: {type: string}
  direct_profile_mutation_allowed: {enum: [false]}
  direct_skill_mutation_allowed: {enum: [false]}
  direct_tool_mutation_allowed: {enum: [false]}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
