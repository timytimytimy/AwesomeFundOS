version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - graph_id
  - source_path
  - run_id
  - traceability_score
  - claim_node_count
  - evidence_node_count
  - decision_claim_count
  - agent_claim_count
  - tool_result_node_count
  - unsupported_decision_claims
  - low_tier_decision_claims
  - tool_evidence_without_trace
  - blocking_issues
  - controls
  - real_trade_allowed
  - broker_integration
properties:
  version: {type: string}
  artifact_type: {enum: [claim_graph_report]}
  graph_id: {type: string}
  source_path: {type: string}
  run_id: {type: string}
  traceability_score: {type: number}
  claim_node_count: {type: integer}
  evidence_node_count: {type: integer}
  decision_claim_count: {type: integer}
  agent_claim_count: {type: integer}
  tool_result_node_count: {type: integer}
  unsupported_decision_claims:
    type: array
    items: {type: object}
  low_tier_decision_claims:
    type: array
    items: {type: object}
  tool_evidence_without_trace:
    type: array
    items: {type: string}
  blocking_issues:
    type: array
    items: {type: string}
  controls:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
