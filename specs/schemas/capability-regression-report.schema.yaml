version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - run_id
  - regression_status
  - candidates_total
  - passed_candidates
  - blocked_candidates
  - candidate_results
  - controls
  - real_trade_allowed
  - broker_integration
properties:
  version: {type: string}
  artifact_type: {enum: [capability_regression_report]}
  run_id: {type: string}
  regression_status: {enum: [passed, blocked, no_pending_capabilities, missing]}
  candidates_total: {type: integer}
  passed_candidates: {type: integer}
  blocked_candidates: {type: integer}
  candidate_results:
    type: array
    items:
      type: object
      required:
        - candidate_id
        - run_id
        - target_agent
        - capability_kind
        - candidate_type
        - target_scope
        - regression_status
        - required_tests
        - test_results
        - blocking_issues
        - application_status_after_regression
        - real_trade_allowed
        - broker_integration
      properties:
        candidate_id: {type: string}
        run_id: {type: string}
        target_agent: {type: string}
        capability_kind: {type: string}
        candidate_type: {type: string}
        target_scope: {type: string}
        regression_status: {enum: [passed, blocked]}
        required_tests:
          type: array
          items: {type: string}
        test_results:
          type: array
          items: {type: object}
        blocking_issues:
          type: array
          items: {type: string}
        application_status_after_regression: {enum: [pending_human_apply, blocked_regression]}
        real_trade_allowed: {enum: [false]}
        broker_integration: {enum: [disabled]}
  controls:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
