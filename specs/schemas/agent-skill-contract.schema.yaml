version: 0.1.0
type: object
required:
  - contract_id
  - agent_id
  - role
  - agent_card_path
  - skill_path
  - agent_contract
  - skill_contract
  - controls
  - real_trade_allowed
  - broker_integration
properties:
  contract_id: {type: string}
  agent_id: {type: string}
  role: {type: string}
  agent_card_path: {type: string}
  skill_path: {type: string}
  agent_contract:
    type: object
    required:
      - contract_id
      - policy_contract_loaded
      - context_contract_loaded
      - required_sections
      - policy_contract
      - context_contract
    properties:
      contract_id: {type: string}
      policy_contract_loaded: {type: boolean}
      context_contract_loaded: {type: boolean}
      required_sections:
        type: array
        items: {type: string}
      policy_contract:
        type: array
        items: {type: string}
      context_contract:
        type: array
        items: {type: string}
  skill_contract:
    type: object
    required:
      - contract_id
      - execution_policy_contract_loaded
      - context_contract_loaded
      - required_sections
      - policy_contract
      - context_contract
    properties:
      contract_id: {type: string}
      execution_policy_contract_loaded: {type: boolean}
      context_contract_loaded: {type: boolean}
      required_sections:
        type: array
        items: {type: string}
      policy_contract:
        type: array
        items: {type: string}
      context_contract:
        type: array
        items: {type: string}
  controls:
    type: array
    items: {type: string}
  real_trade_allowed:
    enum: [false]
  broker_integration:
    enum: [disabled]
