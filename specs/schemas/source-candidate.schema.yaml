version: 0.1.0
type: object
required:
  - source_id
  - display_name
  - source_type
  - source_tier
  - url
  - author
  - summary
  - claims
  - requested_outputs
  - allowed_learning_outputs
  - not_allowed_outputs
  - target_agents
  - required_gates
  - classification_status
  - violations
  - real_trade_allowed
  - broker_integration
properties:
  source_id: {type: string}
  display_name: {type: string}
  source_type:
    enum: [public_practitioner, canonical_framework, book, course, historical_case, social_signal, unknown]
  source_tier:
    enum: [tier_1_primary_fact, tier_2_canonical_framework, tier_3_verified_public_practitioner, tier_4_expert_opinion, tier_5_social_signal, tier_6_unverified]
  url: {type: string}
  author: {type: string}
  summary: {type: string}
  claims:
    type: array
    items: {type: string}
  requested_outputs:
    type: array
    items: {type: string}
  allowed_learning_outputs:
    type: array
    items: {type: string}
  not_allowed_outputs:
    type: array
    items: {type: string}
  target_agents:
    type: array
    items: {type: string}
  required_gates:
    type: array
    items: {type: string}
  classification_status: {enum: [quarantine]}
  violations:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
