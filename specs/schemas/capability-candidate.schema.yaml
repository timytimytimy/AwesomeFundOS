version: 0.1.0
type: object
required:
  - version
  - candidate_id
  - run_id
  - source_agent
  - target_agent
  - candidate_type
  - target_scope
  - status
  - proposal
  - scores
  - reasons
  - source_basis
  - required_tests
  - controls
  - approval_mode
  - human_approval_required
  - protected_mutation_allowed
  - application_status
  - mutated_agent_card
  - mutated_runtime_skill
  - mutated_core_profile
  - real_trade_allowed
  - broker_integration
properties:
  version: {type: string}
  candidate_id: {type: string}
  run_id: {type: string}
  source_agent: {type: string}
  target_agent: {type: string}
  candidate_type: {type: string}
  target_scope: {type: string}
  status: {enum: [approved_candidate, quarantine, reject]}
  proposal: {type: string}
  scores: {type: object}
  reasons:
    type: array
    items: {type: string}
  source_basis:
    type: array
    items: {type: object}
  required_tests:
    type: array
    items: {type: string}
  required_follow_up_tests:
    type: array
    items: {type: string}
  controls:
    type: array
    items: {type: string}
  approval_mode: {enum: [evolution_gate_v1_capability_candidate]}
  adoption_route: {type: [string, 'null']}
  memory_write_policy: {type: [string, 'null']}
  human_approval_required: {enum: [true]}
  protected_mutation_allowed: {enum: [false]}
  application_status: {enum: [pending_human_apply, needs_more_evidence, not_applicable, already_pending_or_recorded, blocked_regression]}
  mutated_agent_card: {enum: [false]}
  mutated_runtime_skill: {enum: [false]}
  mutated_core_profile: {enum: [false]}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
