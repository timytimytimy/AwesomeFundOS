version: 0.1.0
type: object
required:
  - run_id
  - agent_id
  - adapter_id
  - tool_result_id
  - query
  - status
  - permission_level
  - evidence_item_ids
  - real_trade_allowed
  - broker_integration
  - called_at
properties:
  run_id: {type: string}
  agent_id: {type: [string, 'null']}
  adapter_id: {type: string}
  tool_result_id: {type: string}
  query: {type: string}
  status: {enum: [succeeded, blocked]}
  reason: {type: string}
  permission_level: {enum: [read_only_analysis]}
  source_type: {type: string}
  source_tier: {type: string}
  evidence_item_ids:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
  called_at: {type: string}
