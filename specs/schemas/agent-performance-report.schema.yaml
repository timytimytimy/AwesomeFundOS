version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - run_id
  - agent_count
  - average_final_score
  - recommended_action_counts
  - ledger_entries_written
  - agent_results
  - controls
  - real_trade_allowed
  - broker_integration
properties:
  version: {type: string}
  artifact_type: {enum: [agent_performance_report]}
  run_id: {type: string}
  agent_count: {type: integer}
  average_final_score: {type: number}
  recommended_action_counts: {type: object}
  ledger_entries_written: {type: integer}
  agent_results:
    type: array
    items:
      type: object
      required:
        - version
        - run_id
        - agent_id
        - role
        - final_score
        - component_scores
        - recommended_action
        - blocking_issues
        - real_trade_allowed
        - broker_integration
        - risk_limit_changed
        - profile_mutated
        - memory_deleted
      properties:
        version: {type: string}
        run_id: {type: string}
        agent_id: {type: string}
        role: {type: string}
        final_score: {type: number}
        component_scores: {type: object}
        recommended_action: {type: string}
        blocking_issues:
          type: array
          items: {type: string}
        real_trade_allowed: {enum: [false]}
        broker_integration: {enum: [disabled]}
        risk_limit_changed: {enum: [false]}
        profile_mutated: {enum: [false]}
        memory_deleted: {enum: [false]}
  controls:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
