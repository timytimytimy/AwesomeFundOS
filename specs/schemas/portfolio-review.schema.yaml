version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - run_id
  - reviewed_actions
  - watchlist_items
  - attribution_items
  - learning_candidates
  - outcome_tracking
  - real_trade_violations
  - review_verdict
  - controls
  - real_trade_allowed
  - broker_integration
  - disclaimer
properties:
  version: {type: string}
  artifact_type: {enum: [portfolio_review]}
  run_id: {type: string}
  reviewed_actions: {type: integer}
  watchlist_items: {type: integer}
  attribution_items:
    type: array
    items:
      type: object
      required:
        - action_id
        - run_id
        - watchlist_id
        - subject
        - action_type
        - target_weight
        - outcome_status
        - attribution_status
        - real_trade_violation
        - broker_integration
      properties:
        action_id: {type: string}
        run_id: {type: string}
        watchlist_id: {type: string}
        subject: {type: string}
        action_type: {type: string}
        target_weight: {type: number}
        review_date: {type: string}
        evidence_count: {type: integer}
        trigger_count: {type: integer}
        risk_control_count: {type: integer}
        outcome_status: {type: string}
        attribution_status: {type: string}
        attribution_notes:
          type: array
          items: {type: string}
        real_trade_violation: {enum: [false]}
        broker_integration: {enum: [disabled]}
  learning_candidates:
    type: array
    items:
      type: object
      required:
        - candidate_id
        - run_id
        - source_agent
        - target_agent
        - candidate_type
        - target_scope
        - proposal
        - required_tests
        - status
      properties:
        candidate_id: {type: string}
        run_id: {type: string}
        source_agent: {type: string}
        target_agent: {type: string}
        candidate_type: {type: string}
        target_scope: {type: string}
        proposal: {type: string}
        required_tests:
          type: array
          items: {type: string}
        status: {type: string}
  outcome_tracking:
    type: object
    required: [status, results_evaluated, missing_market_replay, outcome_quality_score]
    properties:
      status: {type: string}
      results_evaluated: {type: integer}
      missing_market_replay: {type: integer}
      outcome_quality_score: {type: number}
  real_trade_violations: {type: integer}
  review_verdict: {type: string}
  controls:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
  disclaimer: {type: string}
