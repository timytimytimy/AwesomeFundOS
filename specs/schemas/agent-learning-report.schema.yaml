version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - run_id
  - candidate_count
  - new_candidates
  - merged_to_evolution
  - candidates_by_agent
  - candidate_type_counts
  - target_scope_counts
  - route_counts
  - candidates
properties:
  version: {type: string}
  artifact_type: {enum: [agent_learning_candidate_report]}
  spec_id: {type: string}
  source_path: {type: string}
  run_id: {type: string}
  candidate_count: {type: integer}
  new_candidates: {type: integer}
  merged_to_evolution: {type: integer}
  candidates_by_agent: {type: object}
  candidate_type_counts: {type: object}
  target_scope_counts: {type: object}
  route_counts: {type: object}
  candidates:
    type: array
    items:
      type: object
      required:
        - candidate_id
        - run_id
        - source_agent
        - target_agent
        - candidate_type
        - target_scope
        - proposal
        - source_basis
        - required_tests
        - status
        - controls
        - real_trade_allowed
        - broker_integration
      properties:
        candidate_id: {type: string}
        run_id: {type: string}
        source_agent: {type: string}
        target_agent: {type: string}
        candidate_type: {type: string}
        target_scope: {type: string}
        proposal: {type: string}
        source_basis:
          type: array
          items: {type: object}
        required_tests:
          type: array
          items: {type: string}
        status: {enum: [proposed]}
        controls:
          type: array
          items: {type: string}
        real_trade_allowed: {enum: [false]}
        broker_integration: {enum: [disabled]}
