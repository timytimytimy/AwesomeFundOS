version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - source_count
  - source_tier_counts
  - source_type_counts
  - required_default_gates
  - boundary_policy
  - sources
properties:
  version: {type: string}
  artifact_type: {enum: [learning_source_registry]}
  purpose: {type: string}
  source_count: {type: integer}
  source_tier_counts: {type: object}
  source_type_counts: {type: object}
  required_default_gates:
    type: array
    items: {type: string}
  boundary_policy:
    type: object
    required:
      - real_trade_allowed
      - broker_integration
      - methodology_sources_are_hypothesis_generators
      - primary_evidence_required_for_company_conclusions
      - controls
    properties:
      real_trade_allowed: {enum: [false]}
      broker_integration: {enum: [disabled]}
      methodology_sources_are_hypothesis_generators: {enum: [true]}
      primary_evidence_required_for_company_conclusions: {enum: [true]}
      controls:
        type: array
        items: {type: string}
  sources:
    type: array
    items:
      type: object
      required:
        - id
        - display_name
        - source_tier
        - source_type
        - allowed_learning_outputs
        - not_allowed_outputs
        - required_gates_for_evolution
        - adoption_policy
      properties:
        id: {type: string}
        display_name: {type: string}
        source_url: {type: string}
        source_tier: {type: string}
        source_type: {type: string}
        allowed_learning_outputs:
          type: array
          items: {type: string}
        not_allowed_outputs:
          type: array
          items: {type: string}
        required_gates_for_evolution:
          type: array
          items: {type: string}
        adoption_policy: {type: string}
