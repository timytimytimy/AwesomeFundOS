version: 0.1.0
type: object
required:
  - candidate_id
  - run_id
  - source_agent
  - target_agent
  - candidate_type
  - target_scope
  - proposal
  - source_basis
  - required_tests
  - status
  - controls
  - real_trade_allowed
  - broker_integration
  - adoption_route
  - human_approval_required
  - protected_mutation_allowed
  - auto_apply_allowed
properties:
  candidate_id: {type: string}
  run_id: {type: string}
  source_agent: {type: string}
  target_agent: {type: string}
  candidate_type: {type: string}
  target_scope: {type: string}
  proposal: {type: string}
  source_basis:
    type: array
    items: {type: object}
  required_tests:
    type: array
    items: {type: string}
  status: {enum: [proposed]}
  controls:
    type: array
    items: {type: string}
  metadata: {type: object}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
  adoption_route: {type: string}
  memory_write_policy: {type: string}
  capability_kind: {type: [string, 'null']}
  human_approval_required: {type: boolean}
  protected_mutation_allowed: {enum: [false]}
  auto_apply_allowed: {enum: [false]}
