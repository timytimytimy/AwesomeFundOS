version: 0.1.0
type: object
required:
  - version
  - artifact_type
  - run_id
  - candidate_count
  - agent_count
  - pending_human_apply
  - applied
  - blocked_regression
  - needs_more_evidence
  - not_applicable
  - agents
  - controls
  - real_trade_allowed
  - broker_integration
properties:
  version: {type: string}
  artifact_type: {enum: [agent_capability_ledger]}
  run_id: {type: string}
  candidate_count: {type: integer}
  agent_count: {type: integer}
  pending_human_apply: {type: integer}
  applied: {type: integer}
  blocked_regression: {type: integer}
  needs_more_evidence: {type: integer}
  not_applicable: {type: integer}
  agents:
    type: object
  controls:
    type: array
    items: {type: string}
  real_trade_allowed: {enum: [false]}
  broker_integration: {enum: [disabled]}
