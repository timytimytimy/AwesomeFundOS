version: 0.1.0
type: object
required: [run_id, created_at, input, market, selected_agents, status]
properties:
  run_id: {type: string}
  created_at: {type: string}
  input:
    type: object
    properties:
      input_type:
        enum: [topic, stock, question]
      value: {type: string}
  market: {type: string}
  selected_agents:
    type: array
    items:
      type: object
      properties:
        agent_id: {type: string}
        reason: {type: string}
        context_pack_id: {type: string}
  status:
    enum: [created, evidence_collection, context_routing, agent_work, debate, decision, evaluation, archived, failed]
  artifacts:
    type: array
    items:
      type: object
      properties:
        artifact_id: {type: string}
        path: {type: string}
        type: {type: string}
  model_records:
    type: array
    items:
      type: object
      properties:
        agent_id: {type: string}
        model: {type: string}
        reasoning_effort: {type: string}
        skill_versions:
          type: array
          items: {type: string}
        tool_versions:
          type: array
          items: {type: string}
