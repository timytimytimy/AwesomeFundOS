      - requirement_id: codex-runtime.zh-06
        source_section: 验收标准
        requirement_text: 能以文件为接口支持 Codex 后续实现和调试。
        evidence_paths: [README.md, specs/cli/commands.md, fundos/cli.py, specs/tasks/implementation-plan.md]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_cli_unittest.py' -q, python3 -m unittest discover -s tests -p 'test_reporting.py' -q]
        coverage_status: covered
        safety_boundary_relevant: false
      - requirement_id: codex-runtime.en-01
        source_section: Acceptance Criteria
        requirement_text: fundos init/run/eval/evolve/inspect/report/memory/capabilities/sources/cases/followups/threads/governance/system audit are exposed as local-first CLI workflows.
        evidence_paths: [fundos/cli.py, specs/cli/commands.md, tests/test_cli_unittest.py, tests/test_memory_cli.py]
        verification_commands: [python3 -m fundos.cli --help, python3 -m unittest discover -s tests -p 'test_cli_unittest.py' -q]
