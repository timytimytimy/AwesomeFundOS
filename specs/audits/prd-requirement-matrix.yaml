        safety_boundary_relevant: false
      - requirement_id: codex-runtime.en-02
        source_section: Acceptance Criteria
        requirement_text: Each run writes run.yaml, selected agents, EvidencePack, ContextPacks, Agent outputs, final decision memo, harness artifacts, portfolio artifacts and operating-system-manifest.yaml.
        evidence_paths: [fundos/cli.py, fundos/os_manifest.py, tests/test_system_audit.py]
        verification_commands: [python3 -m fundos.cli system audit --strict]
        coverage_status: covered
        safety_boundary_relevant: false
      - requirement_id: codex-runtime.en-03
        source_section: Acceptance Criteria
        requirement_text: run.yaml model_records must be concrete governance evidence and must never use stub model/tool version placeholders.
        evidence_paths: [fundos/cli.py, fundos/system_audit.py, tests/test_system_audit.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_system_audit.py' -q]
        coverage_status: covered
        safety_boundary_relevant: true
      - requirement_id: codex-runtime.en-04
        source_section: Acceptance Criteria
        requirement_text: system audit --strict must fail missing runtime model records, stale OS manifest summaries, schema violations or broker / real-trade leakage.
        evidence_paths: [fundos/system_audit.py, tests/test_system_audit.py, specs/schemas/operating-system-manifest.schema.yaml]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_system_audit.py' -q]
        coverage_status: covered
        safety_boundary_relevant: true
      - requirement_id: codex-runtime.en-05
        source_section: Acceptance Criteria
        requirement_text: Safety boundary real_trade_allowed=false, broker_integration=disabled, local_file_protocol only in V1.
        evidence_paths: [fundos/system_audit.py, specs/schemas/run.schema.yaml, specs/schemas/operating-system-manifest.schema.yaml, tests/test_system_audit.py]
        verification_commands: [python3 -m fundos.cli system audit --strict]
        coverage_status: covered
        safety_boundary_relevant: true
