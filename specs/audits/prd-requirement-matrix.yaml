        evidence_paths: [fundos/context.py, fundos/agent_outputs.py, specs/schemas/context-pack.schema.yaml, tests/test_context_management_harness.py, tests/test_agent_runtime_integration.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_context_management_harness.py' -q]
        coverage_status: covered
