artifact_type: prd_requirement_matrix
version: 0.1.0
source_prd_root: docs/prd
coverage_policy:
  every_acceptance_criterion_has_evidence_paths: true
  evidence_paths_must_exist: true
  implementation_evidence_required: true
  verification_evidence_required: true
  runtime_evidence_required_for_runtime_claims: true
  safety_boundary_required_for_every_module: true
modules:
  - module_id: agent-system
    prd_path: docs/prd/modules/agent-system-prd.md
    requirement_count: 12
    acceptance_criteria:
      - requirement_id: agent-system.zh-01
        source_section: 验收标准
        requirement_text: 能从默认 Roster 加载 19 个 Agent。
        evidence_paths: [specs/agents/default-roster.yaml, fundos/cli.py, tests/test_system_audit.py, tests/test_agent_assets.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_agent_assets.py' -q, python3 -m fundos.cli roster list]
        coverage_status: covered
        safety_boundary_relevant: false
      - requirement_id: agent-system.zh-02
        source_section: 验收标准
        requirement_text: 每个 Agent 有 Profile、ContextPolicy、ModelPolicy、Skillset 和 Tool policy。
        evidence_paths: [fundos/cli.py, specs/agents/agent-cards, specs/agents/context-policies, specs/agents/tool-policies, specs/agents/memory-policies, specs/agents/agent-skill-contract-manifest.yaml, tests/test_agent_assets.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_agent_assets.py' -q, python3 -m fundos.cli init]
        coverage_status: covered
        safety_boundary_relevant: false
      - requirement_id: agent-system.zh-03
        source_section: 验收标准
        requirement_text: 每次 run 能动态选择 7-10 个 Agent，并记录选择原因。
        evidence_paths: [fundos/cli.py, specs/agents/default-roster.yaml, tests/test_cli_unittest.py, tests/test_system_audit.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_cli_unittest.py' -q, python3 -m unittest discover -s tests -p 'test_cli_unittest.py' -q]
        coverage_status: covered
        safety_boundary_relevant: false
      - requirement_id: agent-system.zh-04
        source_section: 验收标准
        requirement_text: 每个 Agent 输出都能绑定 context_pack_id、skill_versions、tool_versions、model_policy。
        evidence_paths: [fundos/agent_outputs.py, fundos/context.py, fundos/agent_outputs.py, tests/test_agent_runtime_integration.py, tests/test_agent_harness.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_agent_runtime_integration.py' -q]
        coverage_status: covered
        safety_boundary_relevant: false
      - requirement_id: agent-system.zh-05
        source_section: 验收标准
        requirement_text: 每次 run 的 run.yaml 必须为参与 Agent 写入 concrete model_records，且不得使用 stub 占位符。
        evidence_paths: [fundos/cli.py, specs/schemas/run.schema.yaml, fundos/system_audit.py, tests/test_system_audit.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_system_audit.py' -q, python3 -m fundos.cli system audit --strict]
        coverage_status: covered
        safety_boundary_relevant: true
      - requirement_id: agent-system.zh-06
        source_section: 验收标准
        requirement_text: Harness 能按 Agent 维度评分。
        evidence_paths: [fundos/agent_harness.py, fundos/agent_performance.py, specs/schemas/agent-harness-report.schema.yaml, tests/test_agent_harness.py, tests/test_agent_performance.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_agent_harness.py' -q]
        coverage_status: covered
        safety_boundary_relevant: false
      - requirement_id: agent-system.zh-07
        source_section: 验收标准
        requirement_text: Harness 能检查 Agent Card / Skill Contract / ContextPack / structured output 的一致性，并生成 harness/agent-harness.yaml。
        evidence_paths: [fundos/agent_harness.py, specs/schemas/agent-harness-report.schema.yaml, tests/test_agent_harness.py, tests/test_context_management_harness.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_agent_harness.py' -q]
        coverage_status: covered
        safety_boundary_relevant: false
      - requirement_id: agent-system.en-01
        source_section: Acceptance Criteria
        requirement_text: Every roster Agent has a source-controlled agent.md, runtime model record, ContextPolicy, ToolPolicy, MemoryPolicy, persistent Thread namespace, harness hooks and evolution path.
        evidence_paths: [specs/agents/agent-cards, specs/skills, specs/agents/context-policies, specs/agents/tool-policies, specs/agents/memory-policies, fundos/agent_threads.py, fundos/evolution.py, fundos/system_audit.py, tests/test_agent_threads.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_agent_threads.py' -q, python3 -m fundos.cli system audit --strict]
        coverage_status: covered
        safety_boundary_relevant: false
      - requirement_id: agent-system.en-02
        source_section: Acceptance Criteria
        requirement_text: Agent identity remains independent across Profile, Skills, Tools, Memory, Thread, Harness and Evolution artifacts.
        evidence_paths: [specs/agents/agent-skill-contract-manifest.yaml, fundos/os_manifest.py, fundos/system_audit.py, tests/test_agent_assets.py, tests/test_module_boundaries.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_module_boundaries.py' -q]
        coverage_status: covered
        safety_boundary_relevant: false
      - requirement_id: agent-system.en-03
        source_section: Acceptance Criteria
        requirement_text: Agent outputs must cite Evidence ID / Claim ID where factual conclusions are made and must preserve role boundaries.
        evidence_paths: [fundos/agent_outputs.py, fundos/agent_harness.py, fundos/claim_graph.py, tests/test_agent_runtime_integration.py, tests/test_claim_graph.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_claim_graph.py' -q]
        coverage_status: covered
        safety_boundary_relevant: false
      - requirement_id: agent-system.en-04
        source_section: Acceptance Criteria
        requirement_text: Long-term learning can only update controlled memory or capability registries after Harness / EvolutionGate approval.
        evidence_paths: [fundos/evolution.py, fundos/memory.py, fundos/capability_apply.py, tests/test_evolution_gate.py, tests/test_memory_writeback.py, tests/test_capability_apply.py]
        verification_commands: [python3 -m unittest discover -s tests -p 'test_evolution_gate.py' -q, python3 -m unittest discover -s tests -p 'test_capability_apply.py' -q]
        coverage_status: covered
        safety_boundary_relevant: true
      - requirement_id: agent-system.en-05
        source_section: Acceptance Criteria
        requirement_text: Safety boundary real_trade_allowed=false, broker_integration=disabled, research / watchlist / paper-only.
        evidence_paths: [fundos/system_audit.py, specs/agents/agent-skill-contract-manifest.yaml, specs/schemas/run.schema.yaml, tests/test_system_audit.py]
        verification_commands: [python3 -m fundos.cli system audit --strict]
        coverage_status: covered
        safety_boundary_relevant: true
  - module_id: codex-runtime
    prd_path: docs/prd/modules/codex-runtime-prd.md
