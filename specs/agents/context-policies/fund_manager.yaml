version: 0.1.0
agent_id: fund_manager
role: FundManagerAgent
context_policy_id: fund_manager_context
role_family: fund_manager
token_budget: 9000
max_context_items: 12
preferred_context_tags:
- industry
- company
- trading
- risk
- bear_case
preferred_source_tiers:
- tier_1_primary_fact
- tier_2_canonical_framework
- tier_3_verified_public_practitioner
preferred_claim_types:
- fact
- inference
- hypothesis
- opinion
must_preserve:
- evidence_ids
- claim_ids
- contradictions
- missing_evidence
- source_tiers
- low_confidence_claims
compression_style:
- committee_memo
- decision_alternative_table
- weakest_link_table
priority_lenses:
- committee_disagreement
- weakest_evidence_link
- risk_reward
- position_range
- kill_criteria
required_focus:
- 综合判断
- 证据追溯
- 流程完整性
exclusion_rules:
- real_trade_orders
- personal_financial_advice
- uncited_high_confidence_claims
- brokerage_instructions
evidence_selection:
  match_mode: claim_relevance_tag_overlap
  include_governance_agents_all_claims: true
  prefer_primary_sources: true
  cap_low_tier_confidence: true
  kol_and_books_as_methodology_only: true
harness_checks:
- source_policy_match
- context_budget_respected
- must_preserve_satisfied
- role_focus_alignment
- no_real_trade_action
real_trade_allowed: false
broker_integration: false
