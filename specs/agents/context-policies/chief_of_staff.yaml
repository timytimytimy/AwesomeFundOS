version: 0.1.0
agent_id: chief_of_staff
role: ChiefOfStaffAgent
context_policy_id: chief_of_staff_context
role_family: operator
token_budget: 7000
max_context_items: 10
preferred_context_tags:
- industry
- company
- trading
- risk
- bear_case
preferred_source_tiers:
- tier_1_primary_fact
- tier_2_canonical_framework
- tier_3_verified_public_practitioner
preferred_claim_types:
- fact
- inference
- hypothesis
- opinion
must_preserve:
- evidence_ids
- claim_ids
- contradictions
- missing_evidence
- source_tiers
- low_confidence_claims
compression_style:
- routing_table
- dag_state
- artifact_checklist
priority_lenses:
- task_intent
- agent_staffing
- artifact_routing
- dag_state
- handoff_blockers
required_focus:
- 综合判断
- 证据追溯
- 流程完整性
exclusion_rules:
- real_trade_orders
- personal_financial_advice
- uncited_high_confidence_claims
- brokerage_instructions
evidence_selection:
  match_mode: claim_relevance_tag_overlap
  include_governance_agents_all_claims: true
  prefer_primary_sources: true
  cap_low_tier_confidence: true
  kol_and_books_as_methodology_only: true
harness_checks:
- source_policy_match
- context_budget_respected
- must_preserve_satisfied
- role_focus_alignment
- role_context_contract_satisfied
- no_real_trade_action
real_trade_allowed: false
broker_integration: false
required_context_dimensions:
- task_intent
- agent_staffing
- artifact_routing
- handoff_blockers
forbidden_drop_list:
- risk_blockers
- task_intent
- handoff_blockers
- artifact_paths
- source_tiers
- evidence_ids
- claim_ids
