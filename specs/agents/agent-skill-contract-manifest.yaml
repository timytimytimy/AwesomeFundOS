contracts:
- contract_id: chief_of_staff_agent_skill_contract_v1
  agent_id: chief_of_staff
  role: ChiefOfStaffAgent
  agent_card_path: specs/agents/agent-cards/chief_of_staff/agent.md
  skill_path: specs/skills/chief_of_staff/SKILL.md
  agent_contract:
    contract_id: chief_of_staff_agent_policy_contract_v1
    policy_contract_loaded: true
    context_contract_loaded: true
    required_sections:
    - Policy Contract
    - Context Contract
    - Memory Policy
    - Tool Policy
    - Evolution Contract
    - Safety Boundary
    policy_contract:
    - 'contract_id: `chief_of_staff_agent_policy_contract_v1`.'
    - 'policy_contract_loaded: true.'
    - 'required_contracts: Profile, Context Contract, Memory Policy, Tool Policy,
      Evolution Contract, Safety Boundary, and Output Contract.'
    - 'runtime_application: ContextPack must load this contract and every structured
      output must echo the compact policy contract before Harness scoring.'
    - 'controls: policy_contract_loaded; context_contract_loaded; memory_tool_evolution_safety_boundaries_required;
      no_real_trade_action; broker_integration_disabled.'
    - 'invariant: real_trade_allowed=false; broker_integration=disabled; research
      / watchlist / Paper Portfolio only.'
    context_contract:
    - 'context_contract_loaded: true.'
    - 'input_scope: assigned ContextPack, role-specific context policy, approved memory
      summary, source registry, and orchestrator-provided handoffs only.'
    - 'compression_contract: preserve Evidence IDs, Claim IDs, source tiers, contradictions,
      missing evidence, excluded context, confidence caps, and role-critical triggers.'
    - 'forbidden_context_use: do not use unscoped run dumps, private account data,
      broker state, or KOL/social material as direct company evidence.'
    - 'handoff_contract: when context belongs to another role, create an explicit
      handoff instead of silently reasoning outside mandate.'
    - 'harness_contract: context loss, role drift, source-tier inflation, or safety-boundary
      loss must become Harness issues or Evolution Candidates.'
  skill_contract:
    contract_id: chief_of_staff_skill_execution_policy_contract_v1
    execution_policy_contract_loaded: true
    context_contract_loaded: true
    required_sections:
    - Policy Contract
    - Context Contract
    - Tool Use Policy
    - Memory Policy
    - Evolution Policy
    - Safety Boundary
    policy_contract:
    - 'contract_id: `chief_of_staff_skill_execution_policy_contract_v1`.'
    - 'execution_policy_contract_loaded: true.'
    - 'required_contracts: Context Contract, Tool Use Policy, Memory Policy, Evolution
      Policy, Safety Boundary, Guardrails, and Quality Gates.'
    - 'output_application: structured output must include `policy_contract` copied
      from the loaded agent and skill contracts before Agent Harness evaluation.'
    - 'controls: policy_contract_loaded; execution_policy_contract_loaded; context_contract_loaded;
      memory_tool_evolution_safety_boundaries_required; no_real_trade_action; broker_integration_disabled.'
    - 'invariant: real_trade_allowed=false; broker_integration=disabled; Research
      / watchlist / Paper Portfolio only.'
    context_contract:
    - 'context_contract_loaded: true.'
    - 'input_scope: use the assigned Agent-specific ContextPack, source registry,
      approved memory summary, and orchestrator handoffs only.'
    - 'compression_contract: preserve Evidence IDs, Claim IDs, source tiers, missing
      evidence, contradiction table, excluded context, confidence caps, and role-specific
      checklist state.'
    - 'forbidden_context_use: do not fill gaps from unscoped context, stale memory,
      private account data, broker state, or KOL/social material treated as direct
      evidence.'
    - 'escalation_contract: if essential context is missing or outside mandate, cap
      confidence and emit next_research_tasks or handoff rather than inventing facts.'
    - 'harness_contract: Context Harness and Agent Harness must be able to score context
      preservation, role consistency, tool policy compliance, and safety boundaries.'
  controls:
  - policy_contract_loaded
  - execution_policy_contract_loaded
  - context_contract_loaded
  - memory_tool_evolution_safety_boundaries_required
  - no_real_trade_action
  - broker_integration_disabled
  real_trade_allowed: false
  broker_integration: disabled
