known_lessons:
  - Policy direction must be mapped to actual spending, demand, and company exposure.
  - Policy normalization can change odds before fundamentals visibly deteriorate.
failure_modes: [policy_headline_overweight, implementation_gap, exit_signal_missed]
replay_questions:
  - Was policy translated into measurable company or industry evidence?
  - Were withdrawal and normalization signals included in kill criteria?
