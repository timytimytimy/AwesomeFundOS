market: CN_A_SHARE
time_range: policy_support_to_policy_normalization
market_state: policy_cycle_turning_point
summary: Policy-driven cycles can create demand, valuation expansion, and later normalization risk; agents must separate policy intent, implementation, company benefit, and exit conditions.
tags: [policy, industry, macro, risk, trading]
pattern_ids: [a_share_theme_diffusion_case, howard_marks_cycle_risk]
