id: minervini_trend_template
name: Trend template and VCP risk discipline
source_id: mark_minervini
source_tier: tier_2_canonical_framework
pattern_type: trading_checklist
tags: [trading, risk]
target_agents: [position_trend_trader, swing_trader, defensive_execution_trader]
summary: Treat trend leadership, volatility contraction, tight risk, and immediate invalidation as preconditions for simulated trend trades.
checklist:
  - Confirm higher-timeframe uptrend and leadership before discussing entry.
  - Look for volatility contraction rather than broad, loose action.
  - Avoid extended setups without a tight invalidation point.
  - Size only after stop distance and portfolio risk are known.
  - Exit quickly when the setup fails instead of rationalizing.
validation_gates:
  - price_series_check
  - stop_distance_check
  - drawdown_check
not_allowed_outputs:
  - trade_without_stop
