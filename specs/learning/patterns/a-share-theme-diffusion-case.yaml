summary: Use historical theme diffusion cases to distinguish policy ignition, first-wave leaders, second-wave suppliers, late-stage speculation, and breakdown risk.
checklist:
  - Identify the ignition source: policy, order, technology, liquidity, or overseas mapping.
  - Separate first-wave leaders from late-stage sympathy names.
  - Track diffusion breadth and evidence quality decay.
  - Look for late-stage signs: low-quality names leading, excessive turnover, and narrative repetition.
  - Convert the case into falsifiable pattern tests rather than direct analogies.
