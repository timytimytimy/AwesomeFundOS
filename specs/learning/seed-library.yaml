version: 0.1.0
purpose: Initial learning source library for AwesomeFundOS V1 agents.
source_policy:
  copyright_boundary: Store public metadata, legal summaries, distilled patterns, and links only. Do not ingest paid course text or copyrighted book chapters.
  investment_boundary: Learning sources generate frameworks, hypotheses, cases, and skill candidates; final A-share conclusions still require primary evidence.
sources:
  - id: serenity_aleabitoreddit
    display_name: Serenity / aleabitoreddit
    source_tier: tier_3_verified_public_practitioner
    source_type: public_practitioner
    public_handles:
      - X: aleabitoreddit
      - Substack: aleabitoreddit.substack.com
    primary_value:
      - secular trend recognition
      - AI and semiconductor supply-chain chokepoint mapping
      - research gap identification
      - anti-consensus framing
      - falsification discipline
    target_agents:
      - tech_growth_analyst
      - advanced_manufacturing_analyst
      - bear_debater
      - learning_curator
    allowed_learning_outputs:
      - research_lens
      - decision_principle_candidate
      - skill_candidate
      - case_pattern
      - checklist
    not_allowed_outputs:
      - direct_a_share_buy_signal
      - unverified_company_fact
      - copied_target_price
      - copied_position_size
      - copied_option_trade
    validation_required:
      - source_trace
      - target_market_adaptation
      - primary_evidence_check
      - historical_case_replay
      - bear_case_review
    distilled_patterns:
      - name: scheme_first_chokepoint_mapping
        summary: Start from a named downstream system architecture, derive bottlenecks through BOM/subsystems/process constraints, then map companies only after evidence checks.
      - name: research_gap_questioning
        summary: Ask what market participants may miss and what public evidence would falsify the hidden bottleneck thesis.

  - id: lihai_a_share
    display_name: 里海 A股交易框架
    source_tier: tier_3_verified_public_practitioner
    source_type: public_practitioner
    primary_value:
      - A-share market state recognition
