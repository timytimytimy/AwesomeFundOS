    distilled_patterns:
      - name: second_level_thinking
        summary: Explicitly compare consensus expectation, variant perception, odds, and downside before forming a simulated decision.
      - name: risk_first_review
        summary: Evaluate permanent loss, adverse scenarios, and price paid rather than only upside narratives.

