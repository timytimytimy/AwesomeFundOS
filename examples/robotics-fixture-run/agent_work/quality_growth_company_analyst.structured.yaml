decision_principles_applied:
- No source, no confidence; every important claim must cite Evidence ID and Claim
  ID.
- Separate fact, opinion, inference, hypothesis, and missing evidence.
- Preserve contradictions and uncertainty instead of smoothing them away.
- Learning sources can provide lenses and checklists, but A-share conclusions require
  primary or cross-validated evidence.
- Map companies only after validating industry link, revenue exposure, customer evidence,
  or filings.
- Do not upgrade a narrative when the evidence chain is only social signal or expert
  opinion.
role_checklist_applied:
- 从财报、现金流、ROE、毛利率和竞争优势验证质量。
- 检查增长是否来自真实需求、份额提升或会计因素。
- 结合 CAN SLIM/质量成长框架识别领导者。
- 给出估值、业绩和护城河的证据缺口。
skill_evidence_rules:
- No source, no confidence.
- Cite Evidence ID and Claim ID for important claims.
- 'Rank evidence by source tier: primary facts > canonical frameworks > verified practitioners/KOLs
  > expert opinions > social signals > unverified material.'
- Serenity, 里海, classic traders, books, courses, and 大V material are learning lenses
  or hypothesis generators; they are not direct A-share buy/sell evidence.
- If evidence is missing, say so and cap confidence.
