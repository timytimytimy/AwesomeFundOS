learning_patterns:
- pattern_id: a_share_theme_diffusion_case
  name: A-share theme diffusion historical case pattern
  source_id: historical_case_library
  source_tier: tier_2_canonical_framework
  pattern_type: historical_case_pattern
  tags:
  - industry
  - trading
  - risk
  - bear_case
  summary: Use historical theme diffusion cases to distinguish policy ignition, first-wave
    leaders, second-wave suppliers, late-stage speculation, and breakdown risk.
  checklist:
  - Identify the ignition source: policy, order, technology, liquidity, or overseas
      mapping.
  - Separate first-wave leaders from late-stage sympathy names.
  - Track diffusion breadth and evidence quality decay.
  - Look for late-stage signs: low-quality names leading, excessive turnover, and
      narrative repetition.
  - Convert the case into falsifiable pattern tests rather than direct analogies.
  validation_gates:
  - historical_case_replay
  - analogy_overfit_check
  - evidence_quality_check
  not_allowed_outputs:
  - one_case_direct_mapping
- pattern_id: howard_marks_cycle_risk
  name: Second-level cycle and risk review
  source_id: howard_marks
  source_tier: tier_2_canonical_framework
  pattern_type: risk_framework
  tags:
  - risk
  - bear_case
  - industry
  summary: Compare consensus expectations, variant perception, odds, cycle position,
    and downside before allowing conviction to rise.
  checklist:
  - State the consensus view and the variant view separately.
  - Estimate what must already be priced in for the thesis to fail.
  - List adverse scenarios and permanent-loss paths.
  - Separate good asset from good price.
  - Downgrade conviction when upside narrative dominates downside evidence.
  validation_gates:
  - downside_scenario_check
  - valuation_or_expectation_check
  - bear_case_review
  not_allowed_outputs:
  - upside_only_memo
- pattern_id: serenity_scheme_first_chokepoint
  name: Scheme-first chokepoint mapping
  source_id: serenity_aleabitoreddit
  source_tier: tier_3_verified_public_practitioner
  pattern_type: research_lens
  tags:
  - industry
  - company
  - bear_case
  summary: Start from a concrete downstream system architecture, derive bottlenecks
    through subsystems and constraints, then map companies only after primary evidence
    checks.
  checklist:
  - Name the downstream system and deployment scenario before naming stocks.
  - Break the system into BOM, process, software, data, and distribution constraints.
  - Identify bottleneck-in-bottleneck links where supply, know-how, qualification,
    or customer validation is scarce.
  - Ask what market consensus is missing and what evidence would reveal that gap.
  - Map A-share companies only after announcements, filings, customer evidence, or
    revenue exposure validate the link.
  validation_gates:
  - primary_evidence_check
  - target_market_adaptation
  - bear_case_review
  - historical_case_replay
  not_allowed_outputs:
  - direct_a_share_buy_signal
  - unverified_company_fact
