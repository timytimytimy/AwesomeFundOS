thesis: 机器人产业链投资机会 已有 2 条 fixture/public 一手证据线索和 4 条公开检索结果进入 EvidencePack；仍需真实公告、财报、行情和案例回放继续验证。
bull_case: 若一手公告、政策和产业证据继续确认需求、订单、核心零部件瓶颈和公司映射，研究优先级可提升。
bear_case: 社媒热度和方法论源不能替代订单、收入、客户和价格行为验证；若只有叙事则不得升级。
risk_review: 主要风险是证据链不完整、低等级信号污染、产业链映射过度推断、价格序列缺失。
trading_plan:
  entry_conditions:
  - 真实行情趋势确认
  - 公告/财报验证订单或收入
  - 风控确认模拟仓位上限
  add_conditions:
  - 核心假设被多源验证
  - 价格强度和板块扩散同步
  reduce_conditions:
  - 证据等级下降
  - 量价结构恶化
  - 主题拥挤且基本面未兑现
  exit_conditions:
  - 核心假设被证伪
  - 公告/财报不支持产业链映射
  - 风控触发退出
kill_criteria:
- 缺少一手证据
- 关键假设被公告或财报证伪
- 反方和风控提出未解决阻断项
- 社媒热度成为主要依据
