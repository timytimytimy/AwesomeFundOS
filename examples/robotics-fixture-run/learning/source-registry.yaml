  - primary_evidence_check
  - historical_case_replay
  - bear_case_review
  requires_primary_validation: true
  adoption_policy: methodology_only_until_validated
  distilled_patterns:
  - name: scheme_first_chokepoint_mapping
    summary: Start from a named downstream system architecture, derive bottlenecks
      through BOM/subsystems/process constraints, then map companies only after evidence
      checks.
  - name: research_gap_questioning
    summary: Ask what market participants may miss and what public evidence would
      falsify the hidden bottleneck thesis.
