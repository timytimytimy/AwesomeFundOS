version: 0.1.0
artifact_type: learning_source_registry
purpose: Govern external trader, KOL, book, course, and case learning sources before
  they can become agent memory or capability upgrades.
source_count: 10
source_tier_counts:
  tier_3_verified_public_practitioner: 2
  tier_2_canonical_framework: 8
source_type_counts:
  public_practitioner: 2
  canonical_framework: 8
required_default_gates:
- historical_case_replay
- evidence_quality_check
- role_drift_check
boundary_policy:
  real_trade_allowed: false
  broker_integration: disabled
  primary_evidence_required_for_company_conclusions: true
  methodology_sources_are_hypothesis_generators: true
  copyright_boundary: Store public metadata, legal summaries, distilled patterns,
    and links only. Do not ingest paid course text or copyrighted book chapters.
  investment_boundary: Learning sources generate frameworks, hypotheses, cases, and
    skill candidates; final A-share conclusions still require primary evidence.
  controls:
  - no_direct_trade_signal
  - no_unverified_company_fact
  - no_copied_paid_course_or_book_text
  - primary_evidence_check_before_adoption
  - historical_case_replay_before_memory_write
